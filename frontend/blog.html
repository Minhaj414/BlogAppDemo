<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Post — Blogify</title>
  <meta name="description" content="Read this blog post on Blogify." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Playfair+Display:wght@400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="extra-styles.css">
  <script defer src="auth-menu.js"></script>
  <script defer src="blog-view.js"></script>
</head>
<body>

  <!-- ── Navbar ── -->
  <nav class="navbar" role="navigation" aria-label="Main navigation">
    <div class="navbar-container">
      <div class="navbar-brand">
        <a href="index.html">
          <span class="navbar-logo-dot"></span>
          <h1 class="navbar-title">Blogify</h1>
        </a>
      </div>
      <div id="authArea" class="navbar-auth"></div>
    </div>
  </nav>

  <!-- ── Main ── -->
  <main class="container">

    <article class="blog-full" aria-label="Blog post content">
      <div id="blogContent">
        <p style="text-align:center;padding:64px 0;color:var(--text-faint);">Loading post…</p>
      </div>
    </article>

    <div class="blog-actions">
      <a href="index.html" class="btn-secondary">← Back to Posts</a>
      <div id="ownerActions"></div>
    </div>

    <section class="related-posts" aria-label="More posts from this author">
      <h2>More from this Author</h2>
      <div id="relatedPosts" class="blogs-grid"></div>
    </section>

  </main>

  <!-- ── Footer ── -->
  <footer class="footer" role="contentinfo">
    <div class="footer-bottom" style="margin:0;max-width:100%;border-top:1px solid rgba(255,255,255,0.05);">
      <p>&copy; 2026 Blogify &mdash; Built with ♥ by MJM. Minhaj</p>
    </div>
  </footer>

</body>
</html>
